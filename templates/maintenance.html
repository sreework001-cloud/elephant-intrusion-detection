<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Under Maintenance | Elephant Intrusion Early Warning System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0b0f14;
            color: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
        }
        .maintenance-card {
            width: min(720px, 100%);
            padding: 56px 42px;
            text-align: center;
            border: 1px solid #2a3440;
            border-radius: 20px;
            background: #111821;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
        }
        .icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 28px;
            display: grid;
            place-items: center;
            border: 1px solid #3a4653;
            border-radius: 50%;
            font-size: 46px;
            background: #151e28;
        }
        .status {
            display: inline-block;
            margin-bottom: 20px;
            padding: 7px 14px;
            border: 1px solid #596574;
            border-radius: 999px;
            color: #dce2e8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
        }
        h1 {
            margin: 0 0 16px;
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.15;
        }
        p {
            margin: 0 auto;
            max-width: 560px;
            color: #aeb8c4;
            font-size: 17px;
            line-height: 1.7;
        }
        .divider {
            width: 64px;
            height: 1px;
            margin: 30px auto;
            background: #46515d;
        }
        .system-name {
            color: #dce2e8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .8px;
        }
        .footer {
            margin-top: 26px;
            color: #707b87;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="maintenance-card" role="main" aria-labelledby="maintenance-title">
        <div class="icon" aria-hidden="true">🐘</div>
        <div class="status">SYSTEM UNDER MAINTENANCE</div>
        <h1 id="maintenance-title">We’ll Be Back Soon</h1>
        <p>
            The Elephant Intrusion Early Warning System dashboard is temporarily unavailable
            while we perform system updates and improvements.
        </p>
        <div class="divider"></div>
        <div class="system-name">ELEPHANT INTRUSION EARLY WARNING SYSTEM</div>
        <div class="footer">Please check back shortly.</div>
    </main>
</body>
</html>
